<template>
    <lightning-card title="Item Purchase Tool">
        <div class="slds-p-around_medium">
            <template if:true={account}>
                <div class="slds-box slds-m-bottom_medium">
                    <h2 class="slds-text-heading_medium">{account.Name}</h2>
                    <p>Account Number: {account.AccountNumber}</p>
                    <p>Industry: {account.Industry}</p>
                </div>
            </template>
            <lightning-input
                    label="Search"
                    value={searchTerm}
                    onchange={handleSearchChange}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-combobox
                        label="Type"
                        value={selectedType}
                        options={typeOptions}
                        onchange={handleTypeChange}>
                </lightning-combobox>

                <lightning-combobox
                        label="Family"
                        value={selectedFamily}
                        options={familyOptions}
                        onchange={handleFamilyChange}>
                </lightning-combobox>
            </div>

            <template if:true={items}>
                <p class="slds-m-top_medium">
                    Items found: {items.length}
                </p>
                <lightning-button
                        label={cartButtonLabel}
                        variant="brand-outline"
                        class="slds-m-bottom_medium"
                        onclick={openCartModal}>
                </lightning-button>

                <template for:each={items} for:item="item">
                    <div key={item.Id} class="slds-box slds-m-top_small">
                        <h3 class="slds-text-heading_small">{item.Name}</h3>
                        <p>{item.Description__c}</p>
                        <p>Type: {item.Type__c}</p>
                        <p>Family: {item.Family__c}</p>
                        <p>Price: {item.Price__c}</p>
                        <p>Available: {item.AvailableQuantity__c}</p>
                        <lightning-button
                                label="Details"
                                variant="brand"
                                class="slds-m-top_small"
                                data-id={item.Id}
                                onclick={handleDetailsClick}>
                        </lightning-button>
                        <lightning-button
                                label="Add"
                                variant="success"
                                class="slds-m-top_small slds-m-left_small"
                                data-id={item.Id}
                                onclick={handleAddToCart}>
                        </lightning-button>
                    </div>
                </template>
            </template>

            <template if:true={error}>
                <p class="slds-text-color_error slds-m-top_medium">
                    {error}
                </p>
            </template>
        </div>
    </lightning-card>


    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Item Details</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={selectedItem.Image__c}>
                        <div class="slds-align_absolute-center slds-m-bottom_medium"  style="max-height:70vh;">
                            <img
                                    src={selectedItem.Image__c}
                                    alt={selectedItem.Name}
                                    style="max-width:250px; max-height:250px;"
                            />
                        </div>
                    </template>

                    <lightning-record-view-form
                            record-id={selectedItemId}
                            object-api-name="Item__c">
                        <lightning-output-field field-name="Name"></lightning-output-field>
                        <lightning-output-field field-name="Description__c"></lightning-output-field>
                        <lightning-output-field field-name="Type__c"></lightning-output-field>
                        <lightning-output-field field-name="Family__c"></lightning-output-field>
                        <lightning-output-field field-name="Price__c"></lightning-output-field>
                        <lightning-output-field field-name="AvailableQuantity__c"></lightning-output-field>
                    </lightning-record-view-form>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


    <template if:true={isCartModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={closeCartModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Cart</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={cartItems.length}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th>Unit Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <template for:each={cartRows} for:item="item">
                                <tr key={item.Id}>
                                    <td>{item.Name}</td>
                                    <td>{item.unitPrice}</td>
                                    <td>{item.quantity}</td>
                                    <td>{item.lineTotal}</td>
                                    <td>
                                        <lightning-button
                                                label="Remove"
                                                variant="destructive"
                                                data-id={item.Id}
                                                onclick={handleRemoveFromCart}>
                                        </lightning-button>
                                    </td>
                                </tr>
                            </template>
                            </tbody>
                        </table>

                        <p class="slds-m-top_medium">
                            Cart total: {cartTotal}
                        </p>
                    </template>

                    <template if:false={cartItems.length}>
                        <p>Your cart is empty.</p>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                            label="Checkout"
                            variant="brand"
                            class="slds-m-right_small"
                            onclick={handleCheckout}>
                    </lightning-button>

                    <lightning-button label="Close" onclick={closeCartModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
